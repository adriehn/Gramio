<nav class="gramio-navbar" aria-label="Navegación principal">
  <div class="navbar-brand">
    <a routerLink="/" class="brand-link" aria-label="Gramio - Inicio">
      <span class="brand-icon">
        <img src="/gramio.png" alt="" class="brand-logo">
      </span>
      <span class="brand-name">Gramio</span>
    </a>
  </div>

  @if (auth.isAuthenticated()) {
  <div class="navbar-links">

    <a routerLink="/perfil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
      </svg>
      <span>Perfil metabólico</span>
    </a>

    <a routerLink="/nutricion" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v18" />
        <path d="M5 7h14" />
        <path d="M7 7c0 4 2 6 5 6s5-2 5-6" />
        <path d="M7 13c0 4 2 6 5 6s5-2 5-6" />
      </svg>
      <span>Diario nutricional</span>
    </a>

    <a routerLink="/historial-semanal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="2" />
        <path d="M16 2v4M8 2v4M3 10h18" />
        <path d="M7 14h3M7 17h6" />
      </svg>
      <span>Historial semanal</span>
    </a>

    <a routerLink="/progreso-corporal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12h4l3-8 4 16 3-8h4" />
      </svg>
      <span>Progreso corporal</span>
    </a>


  </div>

  }

  <div class="navbar-actions">
    @if (auth.isAuthenticated()) {
    <div class="user-info" [attr.aria-label]="'Usuario: ' + auth.userEmail()">
      <span class="user-avatar" aria-hidden="true">
        {{ auth.userEmail().charAt(0).toUpperCase() || 'U' }}
      </span>
      <span class="user-email">{{ auth.userEmail() }}</span>
    </div>

    <button type="button" (click)="auth.signOut()" class="logout-button" aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M10 17l5-5-5-5" />
        <path d="M15 12H3" />
        <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
      </svg>
      <span class="logout-label">Salir</span>
    </button>
    } @else {
    <a routerLink="/login" class="login-button">Iniciar sesión</a>
    <a routerLink="/registro" class="register-button">Registrarse</a>
    }

  </div>
</nav>
