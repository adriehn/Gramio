<nav class="gramio-navbar" aria-label="Navegación principal">
  <div class="navbar-brand">
    <a routerLink="/" class="brand-link" aria-label="Gramio - Inicio">
      <span class="brand-icon">
        <img src="/gramio.png" alt="" class="brand-logo">
      </span>
      <span class="brand-name">Gramio</span>
    </a>
  </div>

  @if (auth.isAuthenticated()) {
  <!-- Navegación de escritorio -->
  <div class="navbar-links desktop-links">
    <a routerLink="/perfil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
      </svg>
      <span>Perfil metabólico</span>
    </a>

    <a routerLink="/nutricion" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v18" />
        <path d="M5 7h14" />
        <path d="M7 7c0 4 2 6 5 6s5-2 5-6" />
        <path d="M7 13c0 4 2 6 5 6s5-2 5-6" />
      </svg>
      <span>Diario nutricional</span>
    </a>

    <a routerLink="/historial-semanal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="2" />
        <path d="M16 2v4M8 2v4M3 10h18" />
        <path d="M7 14h3M7 17h6" />
      </svg>
      <span>Historial semanal</span>
    </a>

    <a routerLink="/progreso-corporal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12h4l3-8 4 16 3-8h4" />
      </svg>
      <span>Progreso corporal</span>
    </a>

    <a routerLink="/tdee-observado" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="navbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22a7 7 0 0 0 7-7c0-3-2-5-4-7-.2 2-1 3-2 4-1-4-3-7-5-9 0 4-1 6-3 9a7 7 0 0 0 7 10Z" />
        <path d="M12 22a3 3 0 0 0 3-3c0-1.5-1-2.5-2-3.5-.2 1.3-1 2-2 2.5a3 3 0 0 0 1 4Z" />
      </svg>
      <span>Gasto energético</span>
    </a>
  </div>

  <!-- Menú desplegable para celular -->
  <details class="mobile-menu" #mobileMenu>
    <summary class="menu-toggle" aria-label="Abrir o cerrar menú">
      <span class="hamburger" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="menu-label">Menú</span>
      <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </summary>

    <div class="mobile-menu-panel">
      <a routerLink="/perfil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link"
        (click)="mobileMenu.open = false">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
            <path d="M9 8h6M12 5v6" />
          </svg> Perfil metabólico</span>
      </a>

      <a routerLink="/nutricion" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-link" (click)="mobileMenu.open = false">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22V12" />
            <path d="M12 12C5 12 3 7 3 3c6 0 9 3 9 9Z" />
            <path d="M12 16c0-5 3-8 9-8 0 5-3 8-9 8Z" />
          </svg> Diario nutricional</span>
      </a>

      <a routerLink="/historial-semanal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-link" (click)="mobileMenu.open = false">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M16 3v4M8 3v4M3 10h18" />
            <path d="m8 15 2 2 5-5" />
          </svg>Historial semanal</span>
      </a>

      <a routerLink="/progreso-corporal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-link" (click)="mobileMenu.open = false">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v18h18" />
            <path d="m7 14 4-4 4 3 6-7" />
            <path d="M16 6h5v5" />
          </svg>Progreso corporal</span>
      </a>

      <a routerLink="/tdee-observado" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="mobile-link" (click)="mobileMenu.open = false">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
              d="M12 22c4.4 0 8-3.4 8-7.8 0-3.1-1.8-5.5-4.5-8.2-.2 2.2-1.4 3.5-2.5 4.2C12.8 6.1 10.5 3.5 7 2c.5 4-1 6.1-2.5 8.2C3.5 11.7 3 13 3 14.5 3 18.7 6.8 22 12 22Z" />
            <path
              d="M9 17a3 3 0 0 0 6 0c0-1.2-.8-2.2-2-3.5-.2 1.1-.8 1.7-1.5 2-.2-1-.8-1.8-1.5-2.5-.1 1.6-1 2.5-1 4Z" />
          </svg>Gasto energético</span>
      </a>
    </div>
  </details>
  }

  <div class="navbar-actions">
    @if (auth.isAuthenticated()) {
    <button type="button" (click)="logout()" class="logout-button" aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M10 17l5-5-5-5" />
        <path d="M15 12H3" />
        <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
      </svg>
      <span class="logout-label">Salir</span>
    </button>
    } @else {
    <a routerLink="/login" class="login-button">Iniciar sesión</a>
    <a routerLink="/registro" class="register-button">Registrarse</a>
    }
  </div>
</nav>
