<div class="min-h-[85vh] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
    <header class="mb-6 text-center">
      <h2 class="text-2xl font-extrabold text-emerald-400 tracking-tight">Acceso a Gramio</h2>
      <p class="text-xs text-slate-400 mt-1">Ingresá para registrar pesajes y consultar tu objetivo</p>
    </header>

    <form (ngSubmit)="handleLogin()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Correo Electrónico
        </label>

        <input id="email" type="email" [(ngModel)]="credentials.email" name="email" autocomplete="username"
          aria-describedby="login-error" (input)="auth.clearError()" required placeholder="tu@email.com"
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition" />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
          Contraseña
        </label>
        <input id="password" type="password" [(ngModel)]="credentials.password" name="password" autocomplete="username"
          (input)="auth.clearError()" required placeholder="••••••••"
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition" />
      </div>


      @if (auth.currentError(); as error) {
      <div id="login-error" role="alert" aria-live="polite"
        class="p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs">
        {{ error.userMessage }}
      </div>
      }


      <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="isSubmitting()"
          class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition disabled:opacity-50">
          {{ isSubmitting() ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>

        <button type="button" routerLink="/registro" [disabled]="isSubmitting()"
          class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg transition disabled:opacity-50">
          Registrarme
        </button>
      </div>
    </form>
  </div>
</div>
