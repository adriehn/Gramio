
<main class="register-page">
  <section class="register-card" aria-labelledby="register-title">
    <a class="brand" routerLink="/" aria-label="Gramio, inicio">
      <span class="brand-mark">G</span>
      <span>Gramio</span>
    </a>

    <header class="register-header">
      <p class="eyebrow">TU BIENESTAR, A TU MANERA</p>
      <h1 id="register-title">Creá tu cuenta</h1>
      <p>Registrate para guardar tu perfil y tus objetivos metabólicos.</p>
    </header>

    <form #registerForm="ngForm" (ngSubmit)="handleRegister()">
      <div class="field">
        <label for="displayName">Nombre</label>
        <input
          id="displayName"
          name="displayName"
          type="text"
          [(ngModel)]="displayName"
          autocomplete="name"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="vos@ejemplo.com"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          required
        />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          placeholder="Repetí la contraseña"
          required
        />
      </div>

      <div class="field">
        <label for="sex">Sexo para el cálculo metabólico</label>
        <select id="sex" name="sex" [(ngModel)]="sex" required>
          <option value="male">Masculino</option>
          <option value="female">Femenino</option>
        </select>
      </div>

      <div class="field">
        <label for="birthDate">Fecha de nacimiento</label>
        <input
          id="birthDate"
          name="birthDate"
          type="date"
          [(ngModel)]="birthDate"
          [max]="maxBirthDate"
          autocomplete="bday"
          required
        />
      </div>

      <div class="field">
        <label for="heightCm">Altura (cm)</label>
        <input
          id="heightCm"
          name="heightCm"
          type="number"
          [(ngModel)]="heightCm"
          min="100"
          max="250"
          step="0.1"
          placeholder="Ej. 176"
          required
        />
      </div>

      <p class="feedback error" role="alert" aria-live="polite" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </p>

      <p class="feedback success" role="status" aria-live="polite" *ngIf="successMessage()">
        {{ successMessage() }}
      </p>

      <button
        class="submit-button"
        type="submit"
        [disabled]="isSubmitting() || registerForm.invalid"
      >
        {{ isSubmitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="login-prompt">
      ¿Ya tenés una cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>
  </section>
</main>
